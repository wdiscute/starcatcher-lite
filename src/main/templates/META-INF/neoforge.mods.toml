modLoader="javafml" #mandatory

loaderVersion="[2,]" #mandatory

license="MIT"

issueTrackerURL="https://discord.gg/WsuFsGSegD" #optional

[[mods]] #mandatory
modId="starcatcher_lite"
version="${mod_version}"
displayName="${mod_name}"
displayURL="http://curseforge.com/minecraft/mc-mods/starcatcher_lite"
logoFile = "icon.png"
mod_authors="${mod_authors}" #optional
description='''Starcatcher, now with 99% less content, but keeping the minigame!

Credits:
wdiscute - Main Developer
Nikdo53 - Fishing minigame art
Redeix - Ice tank texture
'''

[[mixins]]
config="starcatcher_lite.mixins.json"

# In neoforge.mods.toml:
[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.starcatcher_lite]] #optional
modId="neoforge" #mandatory
type="required" #mandatory
versionRange="${neo_version_range}" #mandatory
ordering="AFTER"
side="BOTH"

[[dependencies.starcatcher_lite]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="AFTER"
side="BOTH"